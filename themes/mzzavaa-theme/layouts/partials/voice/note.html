{{ $v := index hugo.Data.voices .key }}
<aside class="voice-note {{ .key }}">
    <p class="voice-note-name">
        <img class="voice-note-avatar" src="{{ $v.avatar | relURL }}" alt="" width="40" height="40" loading="lazy">
        {{ if eq .key "junior" }}<span class="hand">Junior says</span>{{ else }}<span class="typed">Senior · review</span>{{ end }}
    </p>
    <div class="voice-note-body">{{ .content }}</div>
</aside>
