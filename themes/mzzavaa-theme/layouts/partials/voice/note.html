{{ $v := index site.Data.voices .key }}
<aside class="voice-note voice-{{ .key }}">
    <img class="voice-note-avatar" src="{{ $v.avatar | relURL }}" alt="{{ $v.name }}" loading="lazy">
    <div class="voice-note-body">
        <div class="voice-note-name"><i class="fas {{ $v.icon }}"></i> {{ $v.name }} <span>{{ $v.role }}</span></div>
        {{ .content }}
    </div>
</aside>
