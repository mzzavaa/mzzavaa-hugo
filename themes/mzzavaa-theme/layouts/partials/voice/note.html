{{ $v := index hugo.Data.voices .key }}
<aside class="voice-note {{ .key }}">
    <img class="voice-note-avatar" src="{{ $v.avatar | relURL }}" alt="" width="44" height="44" loading="lazy">
    <div class="voice-note-body">
        <p class="voice-note-name">{{ $v.name }} <span>{{ $v.role }}</span></p>
        {{ .content }}
    </div>
</aside>
