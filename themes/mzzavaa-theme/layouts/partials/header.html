<header class="site-header">
    <div class="wrap header-row">
        <a href="{{ "/" | relURL }}" class="wordmark" aria-label="{{ .Site.Title }} home">
            Mz<span class="dot dot-junior" aria-hidden="true"></span>Zavaa<span class="dot dot-senior" aria-hidden="true"></span>
        </a>
        <nav class="main-nav" aria-label="Main">
            {{ range .Site.Menus.main }}
            {{/* Current when on the page itself or anywhere below it, e.g. a post under Writing */}}
            {{ $current := or ($.IsMenuCurrent "main" .) (hasPrefix $.RelPermalink (.URL | relURL)) }}
            <a href="{{ .URL | relURL }}"{{ if $current }} aria-current="page"{{ end }}>{{ .Name }}</a>
            {{ end }}
        </nav>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch light or dark mode">light / dark</button>
    </div>
</header>
