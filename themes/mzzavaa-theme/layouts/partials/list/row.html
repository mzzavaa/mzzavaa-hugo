{{/* One line in a repo log: last commit, name, what it is, status stamp */}}
<li class="log-row">
    {{ with .Params.last_commit }}<time datetime="{{ . }}" title="last commit">{{ . }}</time>{{ else }}<time>no commits</time>{{ end }}
    <div class="log-main">
        <a class="log-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
        {{ with .Description }}<p class="log-desc">{{ . | truncate 150 }}</p>{{ end }}
    </div>
    {{ with .Params.status }}<span class="stamp stamp-{{ . }}">{{ . }}</span>{{ end }}
</li>
