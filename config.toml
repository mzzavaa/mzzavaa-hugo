baseURL = "https://mzzavaa.com/"
locale = "en-US"
title = "MzZavaa"
theme = "mzzavaa-theme"

[pagination]
  pagerSize = 12

[markup.highlight]
  noClasses = false
  guessSyntax = true

# Ignore certain warnings
ignoreLogs = ['warning-goldmark-raw-html']

[params]
  # Site description
  description = "A personal space for curiosity, creativity and conscious reflection, written in two voices: Mz Zavaa Junior builds, Mz Zavaa Senior reviews."
  
  # Author information
  [params.author]
    name = "Linda Mohamed"
    bio = "Writer, developer, and creative thinker"
    avatar = "images/profile.jpg"
  
  # Social media links
  [params.social]
    github = "https://github.com/mzzavaa"
    linkedin = "https://www.linkedin.com/in/linda-mohamed/"
  

# Main menu
[menu]
  [[menu.main]]
    identifier = "blog"
    name = "Writing"
    url = "/posts/"
    weight = 2
  [[menu.main]]
    identifier = "junior"
    name = "Junior"
    url = "/voices/junior/"
    weight = 3
  [[menu.main]]
    identifier = "senior"
    name = "Senior"
    url = "/voices/senior/"
    weight = 4
  [[menu.main]]
    identifier = "repos"
    name = "Open source"
    url = "/repos/"
    weight = 5
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 6

# Taxonomies
[taxonomies]
  tag = "tags"
  category = "categories"
  voice = "voices"

# Privacy settings
[privacy]
  [privacy.disqus]
    disable = true
  [privacy.googleAnalytics]
    disable = true
  [privacy.instagram]
    disable = true
  [privacy.x]
    disable = true
  [privacy.vimeo]
    disable = true
  [privacy.youtube]
    disable = true
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
